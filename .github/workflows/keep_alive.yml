name: Keep Hugging Face Backend Alive

on:
  schedule:
    # Chạy mỗi 20 phút để đảm bảo dự án luôn sống
    - cron: '*/20 * * * *'
  # Cho phép bấm chạy thủ công từ giao diện GitHub để test
  workflow_dispatch: 

jobs:
  ping-backend:
    runs-on: ubuntu-latest

    steps:
    - name: Send Ping Request
      run: |
        echo "Dang ping vao backend..."
        STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://thzi-luugame.hf.space/api/health)
        echo "Backend tra ve HTTP Status Code: $STATUS_CODE"
        
        # Kiểm tra nếu không phải HTTP 200 thì bắt workflow phải Fail
        if [ "$STATUS_CODE" -ne 200 ]; then
          echo "❌ Backend dang co van de (Status: $STATUS_CODE)!"
          exit 1
        else
          echo "✅ Backend hoat dong hoan hao."
        fi
