name: Keep Hugging Face Backend Alive

on:
  schedule:
    # Chạy mỗi 24 giờ để đảm bảo dự án luôn sống
    - cron: '0 0 * * *'
  # Cho phép bấm chạy thủ công từ giao diện GitHub để test
  workflow_dispatch: 

jobs:
  ping-backend:
    runs-on: ubuntu-latest

    steps:
    - name: Send Ping Request
      run: |
        # Danh sách các tên miền cần ping
        DOMAINS=(
          "https://thzi-luugame.hf.space/api/health"
          "https://thzi-chinraoto.hf.space/"
        )
        
        FAILED=0
        for DOMAIN in "${DOMAINS[@]}"; do
          echo "Dang ping vao $DOMAIN..."
          
          # Thêm -L để tự động đi theo redirect (sửa lỗi 307)
          STATUS_CODE=$(curl -sL -o /dev/null -w "%{http_code}" "$DOMAIN")
          echo "Backend tra ve HTTP Status Code: $STATUS_CODE"
          
          # Chấp nhận cả 200 (OK) và 401 (Unauthorized - tức là API hoạt động nhưng chặn vì thiếu key)
          if [ "$STATUS_CODE" -eq 200 ] || [ "$STATUS_CODE" -eq 401 ]; then
            echo "✅ $DOMAIN hoat dong hoan hao."
          else
            echo "❌ $DOMAIN dang co van de (Status: $STATUS_CODE)!"
            FAILED=1
          fi
          echo "-----------------------------------"
        done
        
        if [ $FAILED -ne 0 ]; then
          exit 1
        fi